name: Beta build & release

# Builds the Windows installer + portable exe and publishes them as a GitHub
# PRERELEASE whenever a beta tag (e.g. v1.4.0-beta.1) is pushed. Runs on a real
# Windows runner, so the wine-less NSIS patch is not even needed here.

on:
  push:
    tags:
      - "v*-beta.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (standalone) + prepare Electron
        run: npm run build

      - name: Build & publish Windows installer + portable (prerelease)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis portable --publish always

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stag-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: warn
